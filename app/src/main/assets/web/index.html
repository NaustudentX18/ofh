<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>OpenForest</title>
<style>
  :root { --bg:#0B3D2E; --panel:#0f4a38; --text:#e8f5ee; --muted:#9fc7b4; --accent:#4ade80; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 16px; font-weight:700; font-size:17px; background:var(--panel); display:flex; align-items:center; gap:8px; }
  header .dot { width:10px; height:10px; border-radius:50%; background:var(--accent); }
  header .title { flex:1; }
  header select { background:#0d3a2c; color:var(--text); border:1px solid #1a6b4f; border-radius:8px; padding:4px 8px; font-size:13px; max-width:46%; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:10px 12px; border-radius:14px; line-height:1.45; white-space:pre-wrap; word-break:break-word; }
  .user { align-self:flex-end; background:#1a6b4f; }
  .assistant { align-self:flex-start; background:var(--panel); }
  .tool { align-self:center; font-size:12px; color:var(--muted); background:#0d3a2c; padding:4px 10px; border-radius:8px; }
  #inputbar { display:flex; gap:8px; padding:12px; background:var(--panel); }
  #input { flex:1; background:#0d3a2c; color:var(--text); border:1px solid #1a6b4f; border-radius:12px; padding:12px; font-size:15px; outline:none; }
  #send { background:var(--accent); color:#06281c; border:none; border-radius:12px; padding:0 18px; font-weight:700; font-size:15px; }
  #send:disabled { opacity:.5; }
</style>
</head>
<body>
<header><span class="dot"></span><span class="title">OpenForest</span><select id="provider" title="Provider"></select></header>
<div id="log"></div>
<div id="inputbar">
  <input id="input" placeholder="Ask anything…" autocomplete="off">
  <button id="send">Send</button>
</div>
<script>
  const log = document.getElementById('log');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  function add(cls, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }
  let currentAssistant = null;
  function unwrap(x) { return (typeof x === 'string') ? x : (x && typeof x.v === 'string') ? x.v : ''; }
  function sendMsg() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    add('user', text);
    send.disabled = true;
    currentAssistant = add('assistant', '');
    // @ts-ignore
    OFH.send(text);
  }
  send.onclick = sendMsg;
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMsg(); });
  // @ts-ignore
  window.OFH = window.OFH || {};
  // @ts-ignore
  OFH.onDelta = (x) => {
    const t = unwrap(x);
    if (!t) return;
    if (!currentAssistant) currentAssistant = add('assistant', '');
    currentAssistant.textContent += t;
    log.scrollTop = log.scrollHeight;
  };
  // @ts-ignore
  OFH.onDone = (x) => {
    const t = unwrap(x);
    if (t && currentAssistant && !currentAssistant.textContent) currentAssistant.textContent = t;
    currentAssistant = null;
    send.disabled = false;
  };
  // @ts-ignore
  OFH.onTool = (x) => {
    add('tool', '🔧 ' + x.name + (x.args ? ' ' + x.args : '') + ' → ' + x.result);
  };
  // @ts-ignore
  function loadProviders() {
    const sel = document.getElementById('provider');
    const providers = JSON.parse(OFH.getProviders());
    const current = JSON.parse(OFH.getCurrent());
    sel.innerHTML = '';
    providers.forEach(p => {
      const o = document.createElement('option');
      o.value = p.route;
      o.textContent = p.label;
      sel.appendChild(o);
    });
    if (current.provider) sel.value = current.provider;
    sel.onchange = () => {
      const p = providers.find(x => x.route === sel.value);
      OFH.setProvider(sel.value, p.defaultModel);
    };
  }
  loadProviders();
</script>
</body>
</html>
